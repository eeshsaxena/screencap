[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screencap"
version = "0.9.1"
description = "macOS CLI for screen capture"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28.0",
    "packaging",
    "pyfiglet>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
record = [
    # screencap-engine dependencies
    "pydantic>=2.0.0",
    "pynput>=1.7.0",
    "av>=10.0.0",
    "Pillow>=9.0.0",
    "fire>=0.7.1",
    "mss>=6.0.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "pydantic-settings>=2.12.0",
    "openai>=2.11.0",
    "sqlalchemy>=2.0.0",
    "loguru>=0.7.0",
    "psutil>=5.0.0",
    "pympler>=1.0.0",
    "tqdm>=4.0.0",
    "numpy>=1.20.0",
    "faster-whisper>=1.1.0",
    "magic-wormhole>=0.17.0",
    "oa-atomacos>=3.2.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreWLAN>=9.0; sys_platform == 'darwin'",
]
privacy = [
    "detect-secrets>=1.5.0,<2.0",
    "presidio-analyzer>=2.2",
]
privacy-lite = [
    "detect-secrets>=1.5.0,<2.0",
    "datafog[nlp]>=4.3,<5.0",
]
dev = [
    "screencap[record,privacy]",
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
screencap = "screencap.cli:cli"

[tool.setuptools.packages.find]
where = ["src", "packages/screencap-engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "privacy: tests requiring privacy deps (detect-secrets, PII engine)",
]
