[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screencap"
version = "0.25.0"
description = "macOS CLI for screen capture"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28.0",
    "packaging",
    "pyfiglet>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "python-dotenv>=1.0",
    "detect-secrets>=1.5.0,<2.0",
    "presidio-analyzer>=2.2",
    "fast-gliner>=0.1.12,<0.2",
    # Network proxy logging (V1):
    # cryptography upper cap aligned with mitmproxy 11.0.2's
    # `Requires-Dist: cryptography<44.1,>=42.0` -- without the cap,
    # future cryptography 44.1+ releases conflict with the mitmproxy pin.
    "cryptography>=43,<44.1",
    # mitmproxy 11.1+ and 12.x require Python >=3.12; only 11.0.x supports
    # the project's Python 3.10 floor. Revisit if we bump min Python.
    "mitmproxy>=11.0,<11.1",
    # V1.5 body-encryption KEK lives in macOS Keychain via the keyring
    # backend. ``keyring.backends.macOS`` ships with the keyring distro.
    "keyring>=24",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.0.0",
    # CLI live-state commands talk to the daemon via AF_UNIX HTTP through
    # ``httpx.HTTPTransport(uds=...)`` (Phase 2 U1). Promoted from the dev
    # extras because runtime CLI flows now depend on it; not a transitive
    # dep of starlette/uvicorn on the install path we ship.
    "httpx>=0.27",
    # SCR-118 ``screencap mcp`` stdio server. The high-level API lives in the
    # official SDK as ``mcp.server.fastmcp.FastMCP`` (NOT the third-party
    # ``fastmcp`` package). Pinned <2 against a future breaking major.
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
record = [
    # engine dependencies (formerly screencap-engine)
    "pydantic>=2.0.0",
    "pynput>=1.7.0",
    "av>=14.0.0",
    "Pillow>=9.0.0",
    "fire>=0.7.1",
    "mss>=6.0.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "pydantic-settings>=2.12.0",
    "openai>=2.11.0",
    "sqlalchemy>=2.0.0",
    "loguru>=0.7.0",
    "psutil>=5.0.0",
    "pympler>=1.0.0",
    "tqdm>=4.0.0",
    "numpy>=1.20.0",
    "faster-whisper>=1.1.0",
    "oa-atomacos>=3.2.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-CoreWLAN>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=9.0; sys_platform == 'darwin'",
    # SCR-258 U5: present-user (Touch ID + password fallback) evaluation for the
    # CLI-local store unseal fallback, via the dynamic-`objc` LocalAuthentication
    # bridge (mirrors the redaction OCR Vision bridge).
    "pyobjc-framework-LocalAuthentication>=9.0; sys_platform == 'darwin'",
]
privacy = []  # Moved to base dependencies as of v0.11.0
sqlcipher = [
    # Corpus content-index at-rest encryption (search guardrails U4 / R3). The
    # plan pinned ``sqlcipher3-binary``, but no wheel is published for the
    # project's macOS/arm64 + x86_64 / Python 3.12 targets, so we use
    # ``pysqlcipher3`` built from source against a system libsqlcipher
    # (``brew install sqlcipher``). Kept an OPTIONAL extra, not a base dep:
    # ``content_index.py`` imports it lazily and only when the corpus is
    # encrypted (OFF until the U8 flip), so a plain ``pip install`` without a
    # SQLCipher toolchain still works and simply keeps encrypted search
    # unavailable (fail-closed, R8). Bundling libsqlcipher into the signed app
    # for both arches is a release-packaging follow-up (see plan Risks).
    "pysqlcipher3>=1.2.0; sys_platform == 'darwin'",
]
local-model = [
    # SCR-239 opt-in downloadable local model (never bundled by default).
    # These runtimes ship in the per-arch embedded daemon build; the model
    # WEIGHTS (~2 GB) are the opt-in download, not these libs. Kept OUT of
    # `dev`/CI on purpose: the runtime tests stub the backends + `importorskip`,
    # so CI needs no native ML build. `mlx-lm` is Apple-Silicon-only.
    "huggingface_hub>=0.20.0",
    "llama-cpp-python>=0.3.0",
    "mlx-lm>=0.20.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
build = [
    # PyInstaller pinning per `pyinstaller-hooks-contrib` issue #736 --
    # 6.0+ ships the keyring.backends.macOS hook needed for V1.5's
    # Keychain KEK; the contrib bump pulls in current Pillow/AVFoundation
    # hooks. Network proxy logging (V1) doesn't itself touch PyInstaller,
    # but the version is documented here so the V1.5/V1.75 bump-up has
    # a single source of truth.
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib>=2024.7",
]
dev = [
    "screencap[record]",
    "screencap[build]",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
screencap = "screencap.cli:cli"

[tool.setuptools.package-data]
"screencap.privacy" = ["data/**/*.txt", "data/**/VERSION", "data/**/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "privacy: tests for privacy detection pipeline",
    "slow: marks tests as slow / integration (deselect with '-m \"not slow\"')",
    "macos_hw: tests that mock macOS-specific APIs (accessibility, CoreWLAN, AppKit, permissions)",
    "real_scrub: review-data tests that run the genuine NER scrub + chunk recovery instead of the fast fake",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
