name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            python-arch: arm64
          - runner: macos-14    # x86_64 via Rosetta on Apple Silicon runner
            arch: x86_64
            python-arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: pip install -e ".[record]" && pip install pyinstaller

      - name: Audit dependencies
        run: pip install pip-audit && pip-audit

      - name: Build frozen binary
        run: pyinstaller pyinstaller/screencap.spec

      - name: Smoke test
        run: ./dist/screencap/screencap --help

      - name: Package tarball and checksum
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          tar czf screencap-${VERSION}-${{ matrix.arch }}.tar.gz -C dist screencap/
          shasum -a 256 screencap-${VERSION}-${{ matrix.arch }}.tar.gz >> checksums.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: screencap-${{ matrix.arch }}
          path: |
            screencap-*.tar.gz
            checksums.sha256

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Merge checksums
        run: cat */checksums.sha256 > checksums.sha256

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Upload versioned artifacts
          gcloud storage cp */screencap-*.tar.gz gs://screencap-releases/releases/v${VERSION}/
          gcloud storage cp checksums.sha256 gs://screencap-releases/releases/v${VERSION}/
          # Upload/update install script
          gcloud storage cp scripts/install.sh gs://screencap-releases/releases/install.sh
          # Update latest version pointer
          echo "$VERSION" | gcloud storage cp - gs://screencap-releases/releases/latest.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Extract this version's section from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > release_notes.txt
          # Fallback if extraction fails
          if [ ! -s release_notes.txt ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > release_notes.txt
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.txt \
            */screencap-*.tar.gz \
            checksums.sha256
