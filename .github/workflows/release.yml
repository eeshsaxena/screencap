name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            python-arch: arm64
            os: macos
          - runner: macos-14    # x86_64 via Rosetta on Apple Silicon runner
            arch: x86_64
            python-arch: x64
            os: macos
          - runner: windows-latest
            arch: x86_64
            python-arch: x64
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-arch }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[privacy]" && pip install pyinstaller
        shell: bash

      - name: Audit dependencies
        run: pip install pip-audit && pip-audit
        shell: bash

      - name: Build frozen binary
        run: pyinstaller pyinstaller/screencap.spec
        shell: bash

      - name: Smoke test
        run: ./dist/screencap/screencap --help
        if: matrix.os != 'windows'
        shell: bash

      - name: Smoke test (Windows)
        run: dist\screencap\screencap.exe --help
        if: matrix.os == 'windows'
        shell: cmd

      - name: Package tarball and checksum (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          tar czf screencap-${VERSION}-macos-${{ matrix.arch }}.tar.gz -C dist screencap/
          shasum -a 256 screencap-${VERSION}-macos-${{ matrix.arch }}.tar.gz >> checksums.sha256

      - name: Package zip and checksum (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $VERSION = $env:REF_NAME.TrimStart("v")
          Compress-Archive -Path dist\screencap -DestinationPath "screencap-${VERSION}-windows-x86_64.zip"
          $hash = (Get-FileHash "screencap-${VERSION}-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "${hash}  screencap-${VERSION}-windows-x86_64.zip" | Set-Content -NoNewline -Encoding ascii checksums.sha256
          Add-Content checksums.sha256 ""

      - uses: actions/upload-artifact@v4
        with:
          name: screencap-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            screencap-*.tar.gz
            screencap-*.zip
            checksums.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Merge checksums
        run: cat */checksums.sha256 | tr -d '\r' > checksums.sha256

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Upload versioned artifacts
          shopt -s nullglob
          for f in */screencap-*.tar.gz */screencap-*.zip; do
            gcloud storage cp "$f" "gs://screencap-releases/releases/v${VERSION}/"
          done
          gcloud storage cp checksums.sha256 gs://screencap-releases/releases/v${VERSION}/
          # Upload/update install scripts
          gcloud storage cp scripts/install.sh gs://screencap-releases/releases/install.sh
          gcloud storage cp scripts/install.ps1 gs://screencap-releases/releases/install.ps1
          # Update latest version pointer
          echo "$VERSION" | gcloud storage cp - gs://screencap-releases/releases/latest.txt
