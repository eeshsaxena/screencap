name: CI

# Run the @pytest.mark.privacy regression guards automatically so a privacy
# regression (e.g. sensitive background-window masking leaking, SCR-110) fails
# a check instead of shipping undetected. The repo had no pytest lane in CI;
# this workflow adds one scoped to the privacy guards (SCR-133).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs on the same ref to save (10x-billed) macOS minutes.
# Pushes to main are NOT cancelled so each main commit runs the guards to
# completion (preserving per-commit CI signal on the protected branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy-guards-macos:
    # Highest-fidelity lane: a macOS runner with pyobjc-Vision installed runs the
    # full @pytest.mark.privacy suite, exercising the real OCR/masking + NER path.
    # Mirrors the runner + Python + install setup used by release.yml.
    name: Privacy guards (macOS, Vision)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Keyed on os+arch (not a hardcoded runner label) so a runner bump
          # invalidates the cache instead of silently reusing stale wheels.
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip past CVE-2026-3219
        # Match release.yml: the runner-shipped pip is flagged by pip-audit; 26.1
        # is the fix release (pypa/pip#13870, GHSA-58qw-9mgm-455v).
        run: pip install --upgrade "pip>=26.1"

      - name: Install dependencies
        # .[dev] pulls .[record] (incl. pyobjc-framework-Vision on darwin) plus the
        # pytest tooling, so both the Vision-backed and Vision-free guards run here.
        run: pip install -e ".[dev]"

      - name: Download spaCy model (presidio NER backbone)
        # The privacy suite exercises the real DetectionPipeline (presidio); its
        # spaCy backbone needs this model. Same step as release.yml.
        run: python -m spacy download en_core_web_sm

      - name: Run privacy guard suite
        # Per-test timeout (pytest-timeout, from .[dev]) keeps a hung test from
        # stalling the whole lane.
        run: pytest -m privacy --timeout=300

  privacy-guards-visionfree:
    # Vision-free backstop: run the @pytest.mark.privacy guards WITHOUT pyobjc-Vision
    # on Linux, so if the macOS lane is unavailable or billing-blocked (binary-test.yml
    # is disabled with `if: false  # billing`, so macOS-minutes pressure is real here)
    # the privacy regressions are still caught. The runtime macOS-only tests — Apple
    # Vision OCR (test_ocr.py) and the Vision branches of test_scrubber_policy.py —
    # self-skip via `skipif(sys.platform != 'darwin')`, so this lane mirrors the macOS
    # lane minus Vision fidelity (SCR-151).
    #
    # Why xvfb-run (do NOT re-narrow this to a single file — SCR-151): `pytest -m
    # privacy` imports the WHOLE test tree to discover markers before deselecting, and
    # several non-privacy modules (tests/engine/*, tests/network/*, test_capture_health*)
    # import screencap.engine.recorder -> pynput at module load. pynput's Xlib backend
    # fails to import on a headless Linux runner (no X server), which broke an earlier
    # broadening attempt with 7 collection errors (run 27702808290). xvfb-run provides a
    # virtual X server so pynput imports and the whole tree collects. Xvfb is
    # pre-installed on the ubuntu-latest runner image, so no apt-get step is needed.
    name: Privacy guards (Vision-free, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip past CVE-2026-3219
        run: pip install --upgrade "pip>=26.1"

      - name: Install dependencies
        # pyobjc / darwin-only deps are auto-skipped on Linux via their
        # `sys_platform == 'darwin'` markers in pyproject.toml.
        run: pip install -e ".[dev]"

      - name: Download spaCy model (presidio NER backbone)
        # The broadened privacy suite exercises the real DetectionPipeline (presidio);
        # its spaCy backbone needs this model. Same step as the macOS lane.
        run: python -m spacy download en_core_web_sm

      - name: Run privacy guard suite (xvfb so pynput imports headless)
        # xvfb-run -a auto-picks a free display number so `pytest -m privacy` can import
        # the whole tree (incl. the pynput-importing non-privacy modules deselected by
        # the marker) without a real X server. Per-test timeout (pytest-timeout, from
        # .[dev]) matches the macOS lane so a hung test fails fast.
        run: xvfb-run -a pytest -m privacy --timeout=300

  lock-policy-contract-linux:
    # SCR-66: pin the start_recording ``_lock_policy``-required contract on every
    # run. TestLockPolicyContract asserts at argument-binding (no mocks, no native
    # deps); tests/test_recorder.py and recorder.py import no pynput/pyobjc at module
    # load, so it collects and runs on a headless Linux runner. Without this lane the
    # guard only ran via a local ``pytest tests/`` (the repo has no general pytest
    # lane), letting a regression that re-adds the InheritLock() default ship green.
    name: Lock-policy contract (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip past CVE-2026-3219
        run: pip install --upgrade "pip>=26.1"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run SCR-66 lock-policy contract guard
        run: pytest tests/test_recorder.py::TestLockPolicyContract -v --timeout=300
