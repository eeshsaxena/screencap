name: ScreenCap

options:
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    # Read from env var so each developer sets their own without committing
    # personal team IDs. Empty string falls back to ad-hoc signing — fine for
    # `xcodebuild` from CI but causes TCC grants to drop on every Cmd+R from
    # Xcode. See macos/README.md "One-time setup" for the recipe.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  ScreenCap:
    type: application
    platform: macOS
    sources:
      - path: ScreenCap
        excludes:
          - "Scripts/**"
          - "Resources/com.screencap.daemon.plist"
          - "Resources/Fonts"
          - "Resources/Fonts/**"
          - "Info.plist"
          - "ScreenCap.entitlements"
          - "AppIcon.icon"
          - "AppIcon.icon/**"
      # Bundled typefaces (KTD-3) as a `type: folder` folder-reference (blue
      # folder), which preserves the `Fonts/` directory in `Contents/Resources/`.
      # The flat sweep above is told to skip these files (excludes) because the
      # default flat resource handling would scatter them into
      # `Contents/Resources/` and leave `ATSApplicationFontsPath: Fonts` pointing
      # at a nonexistent directory — making registration a silent no-op.
      - path: ScreenCap/Resources/Fonts
        type: folder
        buildPhase: resources
      # Icon Composer document: macOS 26+ renders the app icon (light + dark)
      # from this; the classic AppIcon.appiconset stays as the fallback for
      # macOS 13-15. The basename must match ASSETCATALOG_COMPILER_APPICON_NAME
      # for the build system to pick it up. `type: file` keeps the package a
      # single file reference (like .xcassets), not a loose-file group.
      - path: ScreenCap/AppIcon.icon
        type: file
        buildPhase: resources
    resources:
      - path: ScreenCap/Assets.xcassets
    dependencies:
      # Build the on-device segmentation helper alongside the app; the
      # post-build script below copies its product into Contents/MacOS.
      # `embed: false` — a `type: tool` is not a bundle, so it is not eligible
      # for the standard "Embed" copy phase; we place it by hand instead.
      - target: IntelligenceHelper
        embed: false
    info:
      path: ScreenCap/Info.plist
      properties:
        CFBundleDisplayName: ScreenCap
        CFBundleShortVersionString: "0.14.3"
        CFBundleVersion: "23"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.productivity
        # Bundled typefaces live in Contents/Resources/Fonts (folder reference
        # above). macOS registers them at launch; SCFonts.registerBundledFonts()
        # is the belt-and-suspenders programmatic path (KTD-3).
        ATSApplicationFontsPath: Fonts
        NSMicrophoneUsageDescription: "ScreenCap can record audio alongside your screen capture."
        NSCameraUsageDescription: "ScreenCap does not use the camera; this entry exists for permission-pane completeness."
        # NSAppleEventsUsageDescription is intentionally absent — PR1 doesn't send
        # Apple events. Re-add in PR2/Unit 14a when `screencap view` opens
        # viewer.html via a real Apple event path.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencap.macos
        PRODUCT_NAME: ScreenCap
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ScreenCap/ScreenCap.entitlements
        # FoundationModels is weak-linked (mirrors the IntelligenceHelper target)
        # so the app loads on its macOS-13 floor where the framework is absent; the
        # on-device availability probe (`OnDeviceModelStatus.probe`) is
        # `#available(macOS 26)`-guarded and never touches a macOS-26 symbol below it.
        OTHER_LDFLAGS: "-weak_framework FoundationModels"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Aurora signature accent (SCR-197). The global accent propagates the
        # derived solid spring-teal to every `.tint` / `.accentColor` site for
        # free, including surfaces not yet tokenized — preventing a
        # designed-next-to-stock split. Regenerate with `xcodegen generate`.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Embed screencap CLI
        script: |
          "${SRCROOT}/ScreenCap/Scripts/embed-cli.sh"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    postBuildScripts:
      - name: Embed daemon LaunchAgent
        script: |
          set -euo pipefail
          DEST_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          mkdir -p "${DEST_DIR}"
          cp "${SRCROOT}/ScreenCap/Resources/com.screencap.daemon.plist" "${DEST_DIR}/com.screencap.daemon.plist"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
      # Place the on-device segmentation helper at Contents/MacOS/IntelligenceHelper
      # so `OnDeviceProvider._find_bundled_helper()` discovers it. The tool built
      # in this same build lands in BUILT_PRODUCTS_DIR; copy it into the app's
      # executable dir.
      - name: Embed IntelligenceHelper
        script: |
          set -euo pipefail
          SRC="${BUILT_PRODUCTS_DIR}/IntelligenceHelper"
          DEST_DIR="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          if [ -f "${SRC}" ]; then
            mkdir -p "${DEST_DIR}"
            cp "${SRC}" "${DEST_DIR}/IntelligenceHelper"
          else
            echo "warning: IntelligenceHelper product not found at ${SRC}"
          fi
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false

  # On-device (Apple Foundation Models) segmentation helper (U5 / KTD2). A tiny
  # command-line tool the Python `OnDeviceProvider` spawns as a subprocess: it
  # reads the privacy-stripped activity summary on stdin and writes a tasks JSON
  # envelope on stdout. The whole FoundationModels path is `#available(macOS 26)`
  # -guarded so it still COMPILES for the app's macOS 13.0 floor and reports
  # "unavailable" at runtime below macOS 26 (Python then degrades — U7).
  #
  # It builds as its own product and is copied into the app bundle's
  # `Contents/MacOS/IntelligenceHelper` by the app's post-build script below, so
  # `OnDeviceProvider._find_bundled_helper()` discovers it. CLI-only/headless
  # installs (no app bundle) have no helper and always degrade.
  IntelligenceHelper:
    type: tool
    platform: macOS
    sources:
      - path: IntelligenceHelper
    settings:
      base:
        PRODUCT_NAME: IntelligenceHelper
        # The helper is copied into the app's hardened runtime; sign it the same
        # way so the bundle stays consistently signed.
        ENABLE_HARDENED_RUNTIME: YES
        # FoundationModels is weak-linked so the tool loads on the macOS 13.0
        # floor (the framework is absent there); the `#available` guard prevents
        # any macOS-26 symbol from being touched below the floor.
        OTHER_LDFLAGS: "-weak_framework FoundationModels"

  ScreenCapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScreenCapTests
    dependencies:
      - target: ScreenCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencap.macos.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScreenCap:
    build:
      targets:
        ScreenCap: all
        ScreenCapTests: [test]
    run:
      config: Debug
      # Baked into the scheme so it survives `xcodegen generate` — Xcode-UI
      # env vars get wiped on every regen. `$(SRCROOT)/..` is Xcode's source
      # root, portable across developers, no env var needed.
      #
      # PATH is baked in too so Xcode-launched dev builds can resolve a real
      # Python before falling back to the Xcode-bundled 3.9 interpreter.
      # The common locations are harmless if absent, and `${HOME}` expands at
      # xcodegen time per developer.
      environmentVariables:
        - variable: SCREENCAP_DEV_REPO_ROOT
          value: $(SRCROOT)/..
          isEnabled: true
        - variable: PATH
          value: ${HOME}/.pyenv/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: ScreenCapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
