name: ScreenCap

options:
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    # Read from env var so each developer sets their own without committing
    # personal team IDs. Empty string falls back to ad-hoc signing — fine for
    # `xcodebuild` from CI but causes TCC grants to drop on every Cmd+R from
    # Xcode. See macos/README.md "One-time setup" for the recipe.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  ScreenCap:
    type: application
    platform: macOS
    sources:
      - path: ScreenCap
        excludes:
          - "Scripts/**"
          - "Resources/com.screencap.daemon.plist"
          - "Info.plist"
          - "ScreenCap.entitlements"
    resources:
      - path: ScreenCap/Assets.xcassets
    info:
      path: ScreenCap/Info.plist
      properties:
        CFBundleDisplayName: ScreenCap
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "5"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "ScreenCap can record audio alongside your screen capture."
        NSCameraUsageDescription: "ScreenCap does not use the camera; this entry exists for permission-pane completeness."
        # NSAppleEventsUsageDescription is intentionally absent — PR1 doesn't send
        # Apple events. Re-add in PR2/Unit 14a when `screencap view` opens
        # viewer.html via a real Apple event path.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencap.macos
        PRODUCT_NAME: ScreenCap
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: ScreenCap/ScreenCap.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Aurora signature accent (SCR-197). The global accent propagates the
        # derived solid spring-teal to every `.tint` / `.accentColor` site for
        # free, including surfaces not yet tokenized — preventing a
        # designed-next-to-stock split. Regenerate with `xcodegen generate`.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Embed screencap CLI
        script: |
          "${SRCROOT}/ScreenCap/Scripts/embed-cli.sh"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
    postBuildScripts:
      - name: Embed daemon LaunchAgent
        script: |
          set -euo pipefail
          DEST_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          mkdir -p "${DEST_DIR}"
          cp "${SRCROOT}/ScreenCap/Resources/com.screencap.daemon.plist" "${DEST_DIR}/com.screencap.daemon.plist"
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false

  ScreenCapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScreenCapTests
    dependencies:
      - target: ScreenCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screencap.macos.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScreenCap:
    build:
      targets:
        ScreenCap: all
        ScreenCapTests: [test]
    run:
      config: Debug
      # Baked into the scheme so it survives `xcodegen generate` — Xcode-UI
      # env vars get wiped on every regen. `$(SRCROOT)/..` is Xcode's source
      # root, portable across developers, no env var needed.
      #
      # PATH is baked in too so Xcode-launched dev builds can resolve a real
      # Python before falling back to the Xcode-bundled 3.9 interpreter.
      # The common locations are harmless if absent, and `${HOME}` expands at
      # xcodegen time per developer.
      environmentVariables:
        - variable: SCREENCAP_DEV_REPO_ROOT
          value: $(SRCROOT)/..
          isEnabled: true
        - variable: PATH
          value: ${HOME}/.pyenv/shims:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: ScreenCapTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
