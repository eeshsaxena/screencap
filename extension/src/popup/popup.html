<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screencap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        width: 260px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        font: inherit;
        border-radius: 6px;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .account {
        font-size: 13px;
        margin: 0 0 12px;
        word-break: break-all;
      }
      .error {
        font-size: 12px;
        margin: 12px 0 0;
        color: #b3261e;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Screencap</h1>

    <section id="signed-out" hidden>
      <p class="account">Sign in to record your browser work.</p>
      <button id="sign-in">Sign in</button>
    </section>

    <section id="signed-in" hidden>
      <p class="account">Signed in as <strong id="account"></strong></p>
      <button id="sign-out">Sign out</button>
    </section>

    <p id="error" class="error" hidden></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
